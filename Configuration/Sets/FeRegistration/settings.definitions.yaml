settings:
  feRegistration.deleteRedirectPageId:
    label: 'Redirect page after frontend user account deletion'
    description: 'Page UID the user is redirected to after the DeleteAccountFinisher has removed their account. 0 disables the redirect (current page is shown).'
    type: int
    default: 0
    category: 'fe_registration'
  feRegistration.loginPageId:
    label: 'Login page'
    description: 'Page UID linked from the "you already have an account" mail, which replaces the opt-in mail when someone signs up with an address that is already registered. 0 omits the link.'
    type: int
    default: 0
    category: 'fe_registration'