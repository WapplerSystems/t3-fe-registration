
prototypes:
  standard:
    formElementsDefinition:
      Form:
        formEditor:
          editors:
            900:
              selectOptions:
                351:
                  value: 'FeUser'
                  label: 'Create/update fe_users record'
                600:
                  value: CompleteRegistration
                  label: 'Complete registration'
          propertyCollections:
            finishers:
              # The e-mail templates this extension ships, added to the template
              # chooser of the e-mail content modal (Inspector-EmailContentEditor,
              # editor index 250, "availableTemplates" = templateName => label).
              #
              # Previously these were injected as selectOptions of editor index
              # 1800 - the standalone "Template" dropdown that wapplersystems/form_extended
              # added to both e-mail finishers. The wapplersystems/form fork replaced
              # that dropdown with the chooser inside the content modal, so 1800 no
              # longer exists: the override created an editor node carrying only
              # selectOptions and no propertyPath, on which SelectOptionsExtractor
              # throws (#1329289436) - breaking *every* save in the form editor,
              # not just for forms using this extension.
              10:
                editors:
                  250:
                    availableTemplates:
                      'Email/Welcome': 'Welcome Email'
              20:
                editors:
                  250:
                    availableTemplates:
                      'Email/Notification/RegistrationCompleted': 'Registration Completed Notification to Admin'
              351:
                identifier: 'FeUser'
                editors:
                  100:
                    identifier: header
                    templateName: Inspector-CollectionElementHeaderEditor
                    label: 'Create/update fe_users record'
                  350:
                    identifier: mapping
                    templateName: Inspector-PropertyGridEditor
                    label: formEditor.elements.Form.finisher.FeUser.editor.mapping.label
                    propertyPath: options.mapping
                    fieldExplanationText: formEditor.elements.Form.finisher.FeUser.editor.mapping.fieldExplanationText
                    isSortable: true
                    enableAddRow: true
                    enableDeleteRow: true
                    useLabelAsFallbackValue: false
                    gridColumns:
                      -
                        name: databaseField
                        title: formEditor.elements.Form.finisher.FeUser.editor.mapping.gridColumns.databaseField.title
                      -
                        name: formField
                        title: formEditor.elements.Form.finisher.FeUser.editor.mapping.gridColumns.formField.title
                        enableFormelementSelectionButton: true
                        propertyValidators:
                          10: FormElementIdentifierWithinCurlyBracesInclusive
                  400:
                    identifier: pid
                    templateName: Inspector-Typo3WinBrowserEditor
                    label: 'Ordner zum Speichern der Datenätze'
                    buttonLabel: formEditor.elements.Form.finisher.Redirect.editor.pageUid.buttonLabel
                    browsableType: pages
                    iconIdentifier: apps-pagetree-page-default
                    propertyPath: options.pid
                    propertyValidatorsMode: OR
                    propertyValidators:
                      10: Integer
                      20: FormElementIdentifierWithinCurlyBracesExclusive
                  9999:
                    identifier: removeButton
                    templateName: Inspector-RemoveElementEditor
              600:
                identifier: CompleteRegistration
                editors:
                  100:
                    identifier: header
                    templateName: Inspector-CollectionElementHeaderEditor
                    label: 'Complete registration'
                  9999:
                    identifier: removeButton
                    templateName: Inspector-RemoveElementEditor
        renderingOptions:
          templateRootPaths:
            890: 'EXT:fe_registration/Resources/Private/Templates/'
          partialRootPaths:
            890: 'EXT:fe_registration/Resources/Private/Partials/'
          layoutRootPaths:
            890: 'EXT:fe_registration/Resources/Private/Layouts/'
