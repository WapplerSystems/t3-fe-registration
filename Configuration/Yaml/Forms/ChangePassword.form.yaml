renderingOptions:
  submitButtonLabel: 'Passwort ändern'
identifier: ChangePassword
label: 'Passwort ändern'
type: Form
prototypeName: standard
renderables:
  -
    identifier: page-1
    label: ''
    type: Page
    renderingOptions:
      previousButtonLabel: ''
      nextButtonLabel: ''
    renderables:
      -
        type: Password
        identifier: currentPassword
        label: 'Aktuelles Passwort'
        defaultValue: ''
        properties:
          # Existing password, not a new one - no policy indicator here.
          showPasswordPolicy: false
          fluidAdditionalAttributes:
            required: required
            autocomplete: current-password
            autocapitalize: 'off'
            spellcheck: 'false'
        validators:
          -
            identifier: NotEmpty
          -
            identifier: CurrentPassword
      -
        type: AdvancedPassword
        identifier: newPassword
        label: 'Neues Passwort'
        defaultValue: ''
        properties:
          confirmationLabel: 'Neues Passwort wiederholen'
          passwordPolicyHeading: 'Das Passwort muss folgendes erfüllen:'
          passwordToggleShowLabel: 'Anzeigen'
          passwordToggleHideLabel: 'Verbergen'
          passwordGeneratorLabel: 'Passwort generieren'
          fluidAdditionalAttributes:
            required: required
            autocomplete: new-password
            autocapitalize: 'off'
            spellcheck: 'false'
        validators:
          -
            identifier: NotEmpty
finishers:
  -
    identifier: ChangePassword
    options:
      currentPasswordField: currentPassword
      newPasswordField: newPassword
      invalidateSessions: true
  -
    identifier: Confirmation
    options:
      message: '<p>Ihr Passwort wurde geändert. Aus Sicherheitsgründen wurden alle bestehenden Sitzungen beendet. Bitte melden Sie sich mit dem neuen Passwort erneut an.</p>'