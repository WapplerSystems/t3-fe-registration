
renderingOptions:
  submitButtonLabel: 'Jetzt registrieren'
identifier: step1Fast
label: 'Schnelle Registrierung'
type: Form
prototypeName: standard
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-1
    label: ''
    type: Page
    renderables:
      -
        defaultValue: ''
        type: Text
        identifier: firstname
        label: Vorname
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: given-name
          mapOnDatabaseColumn: first_name
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: lastname
        label: Nachname
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            required: required
            autocomplete: family-name
          mapOnDatabaseColumn: last_name
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: Email
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: 'E-Mail Adresse'
            required: required
            autocomplete: email
          mapOnDatabaseColumn: username
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
  -
    type: EmailConfirmation
    identifier: emailconfirmation-1
    label: 'E-mail confirmation by user'
