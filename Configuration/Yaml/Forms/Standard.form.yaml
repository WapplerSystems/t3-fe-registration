
renderingOptions:
  submitButtonLabel: 'Jetzt registrieren'
identifier: Standard
label: 'Standard mit Passwort'
type: Form
prototypeName: standard
renderables:
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-1
    label: ''
    type: Page
    renderables:
      -
        defaultValue: ''
        type: Text
        identifier: firstName
        label: Vorname
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: given-name
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: lastName
        label: Nachname
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Name
            required: required
            autocomplete: family-name
        validators:
          -
            identifier: NotEmpty
      -
        defaultValue: ''
        identifier: email
        label: Email
        type: Email
        properties:
          fluidAdditionalAttributes:
            placeholder: 'E-Mail Adresse'
            required: required
            autocomplete: email
        validators:
          -
            identifier: NotEmpty
          -
            identifier: EmailAddress
          -
            identifier: ConfirmationRequest
          -
            identifier: FeUser
      -
        properties:
          confirmationLabel: Bestätigung
          passwordPolicyHeading: 'Das Passwort muss folgendes erfüllen:'
          passwordToggleShowLabel: 'Anzeigen'
          passwordToggleHideLabel: 'Verbergen'
          passwordGeneratorLabel: 'Passwort generieren'
          fluidAdditionalAttributes:
            required: required
            autocomplete: new-password
          mapOnDatabaseColumn: password
        type: AdvancedPassword
        identifier: password
        label: 'Sichereres Passwort'
        validators:
          -
            identifier: NotEmpty
  -
    type: EmailConfirmation
    identifier: emailconfirmation-1
    label: 'E-mail confirmation by user'
  -
    renderingOptions:
      previousButtonLabel: 'previous Page'
      nextButtonLabel: 'next Page'
    identifier: page-2
    label: ''
    type: Page
    renderables:
      -
        defaultValue: ''
        identifier: city
        label: Stadt
        type: Text
        properties:
          fluidAdditionalAttributes:
            placeholder: Stadt
            required: required
          mapOnDatabaseColumn: city
        validators:
          -
            identifier: NotEmpty
